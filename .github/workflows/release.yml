name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG entry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section. Add it before tagging."
            exit 1
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="offdiff-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/offdiff" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "offdiff-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item -Path "target/${{ matrix.target }}/release/offdiff.exe" -Destination "dist/$name/offdiff.exe"
          Copy-Item -Path README.md, LICENSE, CHANGELOG.md -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/$name"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: offdiff-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-crate:
    name: Publish to crates.io
    needs: [verify, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}. Bump the version and re-tag."
            exit 1
          fi
      - name: Check crates.io token
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is not set."
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"

  release:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(rf"^## \[{re.escape(version)}\][^\n]*$", text, re.M)
          if heading is None:
              print(f"::error::CHANGELOG.md has no section for {version}.")
              sys.exit(1)

          rest = text[heading.end():]
          next_heading = re.search(r"^(?:## \[|\[[^\]]+\]:)", rest, re.M)
          section = (rest[: next_heading.start()] if next_heading else rest).strip()
          if not section:
              print(f"::error::CHANGELOG.md section for {version} is empty.")
              sys.exit(1)

          Path("release_notes.md").write_text(section + "\n", encoding="utf-8")
          print(f"Extracted {len(section)} characters of release notes for {version}.")
          PY
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
