[package]
name = "offdiff"
version = "0.1.0"
edition = "2021"
description = "Structural diff and export for Office and PDF documents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
unpdf = { version = "0.48", default-features = false, features = ["fast-parse", "refine"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
