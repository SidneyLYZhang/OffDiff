[package]
name = "offdiff"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "Extract Office and PDF documents into deterministic JSON or Markdown, built for git diffs and exports"
authors = ["SideyZhang <zly@lyzhang.me>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/SidneyLYZhang/OffDiff"
homepage = "https://github.com/SidneyLYZhang/OffDiff"
keywords = ["git", "diff", "office", "docx", "pdf"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = ["/.github"]

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
unpdf = { version = "0.48", default-features = false, features = ["fast-parse", "refine"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
